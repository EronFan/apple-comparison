        // 状态管理系统
        const AppState = {
            // 私有状态
            _selectedProducts: [],
            
            // 订阅者列表
            _subscribers: [],
            
            // 获取选中产品
            get selectedProducts() {
                return [...this._selectedProducts]; // 返回副本避免直接修改
            },
            
            // 设置选中产品并通知订阅者
            set selectedProducts(products) {
                this._selectedProducts = [...products];
                this._notifySubscribers();
            },
            
            // 添加产品
            addProduct(productId) {
                if (!this._selectedProducts.includes(productId)) {
                    this._selectedProducts.push(productId);
                    this._notifySubscribers();
                }
            },
            
            // 移除产品
            removeProduct(productId) {
                const index = this._selectedProducts.indexOf(productId);
                if (index > -1) {
                    this._selectedProducts.splice(index, 1);
                    this._notifySubscribers();
                }
            },
            
            // 重置产品选择
            resetProducts(allProductIds) {
                this._selectedProducts = [...allProductIds];
                this._notifySubscribers();
            },
            
            // 订阅状态变更
            subscribe(callback) {
                if (typeof callback === 'function' && !this._subscribers.includes(callback)) {
                    this._subscribers.push(callback);
                }
            },
            
            // 取消订阅
            unsubscribe(callback) {
                const index = this._subscribers.indexOf(callback);
                if (index > -1) {
                    this._subscribers.splice(index, 1);
                }
            },
            
            // 通知所有订阅者
            _notifySubscribers() {
                this._subscribers.forEach(callback => callback(this._selectedProducts));
            }
        };

        // 数据重载函数 - 切换语言时重新加载数据
        function reloadDataWithLanguage(language) {
            // 显示加载中状态
            const loadingIndicator = document.getElementById('loading-indicator');
            if (loadingIndicator) loadingIndicator.style.display = 'block';
            
            // 隐藏错误提示
            const errorMessage = document.querySelector('.error-message');
            if (errorMessage) errorMessage.style.display = 'none';
            
            // 开始重新加载数据
            
            const url = `/public/data/watch_refined.json?v=20261123`;
            
            // 异步加载数据
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {

                    // 按发布日期降序排序

                            }

                        };

                        const dateA = new Date(dateStrA.split('.').reverse().join('-'));
                        const dateB = new Date(dateStrB.split('.').reverse().join('-'));
                        return dateB - dateA;
                    });
                    
                    // 设置全局变量以供移动端使用

                    // 初始化产品状态对象

                    // 重置产品选择状态，所有产品非勾选但全部显示

                let displayValue = '-';

                // 处理数组类型（如颜色）
                if (Array.isArray(value)) {
                    if (param.key === 'colors') {
                        displayValue = value.map(color => {
                            const colorName = getLocalizedValue(color.name, currentLang);
                            if (color.code) {
                                return `<span class="color-sample" style="background-color: ${color.code}; width: 12px; height: 12px; display: inline-block; border-radius: 50%; margin: 0 1px;" title="${colorName}"></span>`;

        // 生成滑动指示器
        function generateScrollIndicators() {
            const indicatorsContainer = document.getElementById('mobileScrollIndicators');
            if (!indicatorsContainer) return;

            indicatorsContainer.innerHTML = '';

            const productCount = window.allProducts ? window.allProducts.length : 0;
            for (let i = 0; i < productCount; i++) {
                const indicator = document.createElement('div');
                indicator.className = 'mobile-scroll-indicator';
                if (i === 0) indicator.classList.add('active');
                indicator.dataset.index = i;
                indicator.addEventListener('click', () => scrollToProduct(i));
                indicatorsContainer.appendChild(indicator);
            }
        }

        // 滚动到指定产品
        function scrollToProduct(index) {
            const productsScroll = document.getElementById('mobileProductsScroll');
            if (!productsScroll) return;

            const productWidth = 140; // 产品列宽度
            productsScroll.scrollTo({
                left: index * productWidth,
                behavior: 'smooth'
            });

            // 更新指示器
            updateScrollIndicators(index);
        }

        // 更新滑动指示器
        function updateScrollIndicators(activeIndex) {
            const indicators = document.querySelectorAll('.mobile-scroll-indicator');
            indicators.forEach((indicator, index) => {
                if (index === activeIndex) {
                    indicator.classList.add('active');
                } else {
                    indicator.classList.remove('active');
                }
            });
        }

        // 更新导航按钮状态
        function updateNavigationButtons() {
            const productsScroll = document.getElementById('mobileProductsScroll');
            const prevBtn = document.getElementById('mobilePrevBtn');
            const nextBtn = document.getElementById('mobileNextBtn');

            if (!productsScroll || !prevBtn || !nextBtn) return;

            productsScroll.addEventListener('scroll', () => {
                const scrollLeft = productsScroll.scrollLeft;
                const maxScroll = productsScroll.scrollWidth - productsScroll.clientWidth;

                prevBtn.disabled = scrollLeft <= 0;
                nextBtn.disabled = scrollLeft >= maxScroll - 5;

                // 计算当前显示的产品索引
                const productWidth = 140;
                const currentIndex = Math.round(scrollLeft / productWidth);
                updateScrollIndicators(currentIndex);
            });

            // 绑定按钮点击事件
            prevBtn.addEventListener('click', () => {
                const currentScroll = productsScroll.scrollLeft;
                const productWidth = 140;
                const currentIndex = Math.round(currentScroll / productWidth);
                if (currentIndex > 0) {
                    scrollToProduct(currentIndex - 1);
                }
            });

            nextBtn.addEventListener('click', () => {
                const currentScroll = productsScroll.scrollLeft;
                const productWidth = 140;
                const currentIndex = Math.round(currentScroll / productWidth);
                const maxIndex = (window.allProducts ? window.allProducts.length : 0) - 1;
                if (currentIndex < maxIndex) {
                    scrollToProduct(currentIndex + 1);
                }
            });
        }

        function getCurrentLanguage() {
            return window.currentLanguage || localStorage.getItem('preferredLanguage') || 'zh-CN';

        // 初始化产品选择 - 拆分为初始化和事件绑定两个独立函数
        function initProductSelection() {
            // 1. 初始化产品选择状态
            initProductState();
            
            // 2. 绑定产品选择事件处理器
            bindProductSelectionEvents();
        }

        // 初始化产品状态
        function initProductState() {
            const checkboxes = document.querySelectorAll('.product-checkbox');
            
            // 收集所有产品ID
            const allProductIds = Array.from(checkboxes).map(checkbox => checkbox.id);
            
            // 设置所有复选框为非选中状态
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
                
                // 移除选中样式
                const productElement = checkbox.closest('.product-selector');
                if (productElement) {
                    productElement.classList.remove('selected');
                }
            });
            
            // 初始化全局产品状态对象
            window.productState = {
                _selectedProducts: [],
                selectedProducts: function() {
                    // 获取当前选中的产品
                    const checkboxes = document.querySelectorAll('.product-checkbox:checked');
                    this._selectedProducts = Array.from(checkboxes).map(cb => cb.id);
                    return [...this._selectedProducts];
                },
                setSelectedProducts: function(ids) {
                    this._selectedProducts = ids || [];
                    // 更新UI复选框状态
                    document.querySelectorAll('.product-checkbox').forEach(cb => {
                        cb.checked = this._selectedProducts.includes(cb.id);
                    });
                }
            };
            
            // 兼容旧的AppState对象
            AppState.selectedProducts = [];
            
            // 输出初始化状态信息
            // 产品选择初始化完成
        }

        // 绑定产品选择事件
        function bindProductSelectionEvents() {
            const checkboxes = document.querySelectorAll('.product-checkbox');
            
            checkboxes.forEach(checkbox => {
                // 移除可能存在的旧事件监听器，避免重复绑定
                checkbox.removeEventListener('change', handleProductSelectionChange);
                
                // 添加新的事件监听器
                checkbox.addEventListener('change', handleProductSelectionChange);
            });
        }

        // 产品选择变更事件处理函数
        function handleProductSelectionChange() {
            const productId = this.id;
            const productElement = this.closest('.product-selector');
            const currentSelectedProducts = AppState.selectedProducts;
            
            // 检查当前状态，避免重复操作
            if (this.checked) {
                // 确保不重复添加
                if (!currentSelectedProducts.includes(productId)) {
                    AppState.addProduct(productId);
                    // 添加产品处理
                }
                productElement.classList.add('selected');
            } else {
                // 确保产品存在才移除
                if (currentSelectedProducts.includes(productId)) {
                    AppState.removeProduct(productId);
                    // 移除产品处理
                }
                productElement.classList.remove('selected');
            }
            
            // 调试输出当前选中的产品
            // 当前选中的产品状态更新
        }

        // 更新参数差异高亮
        function updateParameterDifferences(products) {
            // 更新参数差异高亮处理
            
            // 安全地获取选中的产品ID
            let selectedProductIds = [];
            
            if (products && Array.isArray(products)) {
                // 如果直接传入了产品数组
                selectedProductIds = products.map(p => p.id || p);
            } else if (window.productState && typeof window.productState.selectedProducts === 'function') {
                // 使用全局状态对象
                selectedProductIds = window.productState.selectedProducts();
            } else if (AppState && AppState.selectedProducts) {
                // 兼容旧的AppState对象
                selectedProductIds = AppState.selectedProducts;
            } else {
                // 备用方法：直接从DOM中获取
                const checkboxes = document.querySelectorAll('.product-checkbox:checked');
                selectedProductIds = Array.from(checkboxes).map(cb => cb.id);
            }
            
            // 清除所有高亮样式
            document.querySelectorAll('td.param-value.highlight-diff').forEach(cell => {
                cell.classList.remove('highlight-diff');
            });
            
            // 如果选中的产品少于2个，直接返回（已清除所有高亮）
            if (selectedProductIds.length < 2) {
                // 选中产品少于2个，不需要高亮差异
                return;
            }
            
            const tbody = document.querySelector('table tbody');
            const rows = tbody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const cells = row.querySelectorAll('td.param-value');
                const visibleCells = Array.from(cells).filter(cell => {
                    const productId = cell.getAttribute('data-product');
                    return selectedProductIds.includes(productId);
                });
                
                if (visibleCells.length >= 2) {
                    // 获取第一个可见单元格的值作为参考
                    const referenceValue = visibleCells[0].textContent;
                    
                    // 检查是否所有值都相同
                    const allSame = visibleCells.every(cell => cell.textContent === referenceValue);
                    
                    // 如果值不同，高亮显示不同的单元格
                    if (!allSame) {
                        visibleCells.forEach(cell => {
                            cell.classList.add('highlight-diff');
                        });
                    }
                }
            });
        }

        // 绑定事件
        function bindEvents() {
            // 重置按钮事件
            const resetButton = document.getElementById('reset-button');
            if (resetButton) {
                resetButton.removeEventListener('click', handleResetButtonClick); // 移除可能存在的旧事件监听器
                resetButton.addEventListener('click', handleResetButtonClick);
            }
            
            // 对比按钮事件
            const compareButton = document.getElementById('compare-button');
            if (compareButton) {
                compareButton.removeEventListener('click', handleCompareButtonClick); // 移除可能存在的旧事件监听器
                compareButton.addEventListener('click', handleCompareButtonClick);
            }
            
            // 添加按钮点击动画
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    this.classList.add('btn-pressed');
                    setTimeout(() => {
                        this.classList.remove('btn-pressed');
                    }, 200);
                });
            });
        }
        
        // 重置按钮点击事件处理函数
        function handleResetButtonClick() {
            
            // 获取所有产品复选框（桌面端和移动端）
            const desktopCheckboxes = document.querySelectorAll('.product-checkbox');
            const mobileCheckboxes = document.querySelectorAll('.mobile-product-checkbox');
            
            // 重置桌面端复选框状态为非选中
            desktopCheckboxes.forEach(checkbox => {
                checkbox.checked = false;
                const productElement = checkbox.closest('.product-selector');
                if (productElement) {
                    productElement.classList.remove('selected');
                }
            });
            
            // 重置移动端复选框状态为非选中
            mobileCheckboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            
            // 显示所有桌面端产品列
            const desktopTable = document.querySelector('.desktop-table');
            if (desktopTable) {
                document.querySelectorAll('th:not(:first-child)').forEach(cell => {
                    cell.style.display = '';
                });
                
                document.querySelectorAll('td.param-value').forEach(cell => {
                    cell.style.display = '';
                });
            }
            
            // 显示所有移动端产品列
            const mobileProductColumns = document.querySelectorAll('.mobile-product-column');
            mobileProductColumns.forEach(column => {
                column.style.display = '';
            });
            
            // 重置产品选择状态
            if (window.productState && typeof window.productState.setSelectedProducts === 'function') {
                window.productState.setSelectedProducts([]);
                // 使用productState重置产品选择
            } else {
                // 兼容旧的AppState对象
                AppState.selectedProducts = [];
            }
            
            // 清除参数差异高亮
            document.querySelectorAll('td.param-value.highlight-diff').forEach(cell => {
                cell.classList.remove('highlight-diff');
            });
            
            // 重置完成处理
        }
        
        // 对比按钮点击事件处理函数
        function handleCompareButtonClick() {
            
            // 获取所有选中的产品（包括桌面端和移动端）
            const desktopCheckboxes = document.querySelectorAll('input[type="checkbox"].product-checkbox:checked');
            const mobileCheckboxes = document.querySelectorAll('input[type="checkbox"].mobile-product-checkbox:checked');
            
            // 合并选中的产品ID
            const selectedIds = new Set();
            desktopCheckboxes.forEach(cb => selectedIds.add(cb.id));
            mobileCheckboxes.forEach(cb => selectedIds.add(cb.dataset.productId));
            
            const selectedProducts = Array.from(selectedIds);
            
            if (selectedProducts.length === 0) {
                alert('请至少选择一个产品进行对比');
                return;
            }
            
            if (selectedProducts.length === 1) {
                alert('请选择至少两个产品进行对比');
                return;
            }
            
            // 隐藏未选中的产品列
            hideUnselectedProducts(selectedProducts);
            
            // 滚动到表格顶部
            const tableWrapper = document.querySelector('.table-wrapper');
            if (tableWrapper) {
                tableWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 隐藏未选中的产品列
        function hideUnselectedProducts(selectedProducts) {
            // 桌面端表格处理
            const desktopTable = document.querySelector('.desktop-table');
            if (desktopTable) {
                // 处理表头
                const headerCells = desktopTable.querySelectorAll('thead th');
                headerCells.forEach((th, index) => {
                    if (index === 0) return; // 跳过参数名称列
                    
                    const checkbox = th.querySelector('.product-checkbox');
                    if (checkbox && !selectedProducts.includes(checkbox.id)) {
                        th.style.display = 'none';
                    } else {
                        th.style.display = '';
                    }
                });
                
                // 处理数据行
                const dataRows = desktopTable.querySelectorAll('tbody tr');
                dataRows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    cells.forEach((cell, index) => {
                        if (index === 0) return; // 跳过参数名称列
                        
                        const productId = cell.getAttribute('data-product');
                        if (productId && !selectedProducts.includes(productId)) {
                            cell.style.display = 'none';
                        } else {
                            cell.style.display = '';
                        }
                    });
                });
            }
            
            // 移动端表格处理
            const mobileProductColumns = document.querySelectorAll('.mobile-product-column');
            mobileProductColumns.forEach(column => {
                const productId = column.dataset.productId;
                if (productId && !selectedProducts.includes(productId)) {
                    column.style.display = 'none';
                } else {
                    column.style.display = '';
                }
            });
        }

        // 绑定图表相关事件
        function bindChartEvents() {
            // 关闭模态框
            const closeModal = document.querySelector('.close-modal');
            const modal = document.getElementById('performance-chart-modal');
            
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            // 点击模态框外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // 图表类型切换
            const chartTabs = document.querySelectorAll('.chart-tab');
            chartTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    chartTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const chartType = this.getAttribute('data-chart');
                    updatePerformanceChart(chartType);
                });
            });
        }

        // 显示性能图表
        function showPerformanceChart() {
            const modal = document.getElementById('performance-chart-modal');
            modal.style.display = 'block';
            
            // 获取当前激活的图表类型
            const activeTab = document.querySelector('.chart-tab.active');
            const chartType = activeTab ? activeTab.getAttribute('data-chart') : 'cpu';
            
            updatePerformanceChart(chartType);
        }

        // 初始化图表切换按钮
        function initChartTabs() {
            const chartTabs = document.querySelectorAll('.performance-charts-section .chart-tabs .chart-tab');
            chartTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    // 移除所有活动状态
                    chartTabs.forEach(t => t.classList.remove('active'));
                    // 添加当前活动状态
                    this.classList.add('active');
                    // 更新图表类型并重绘
                    currentChartType = this.dataset.chart;
                    updatePerformanceChart(currentChartType);
                });
            });
        }
        
        // 更新性能图表
        function updatePerformanceChart(chartType) {
            // 获取选中的产品数据
            let selectedProductsData = allProducts.filter(product => AppState.selectedProducts.includes(product.id));
            
            // 如果没有选择产品，显示提示信息并清空图表
            if (selectedProductsData.length === 0) {
                // 如果图表已存在，销毁它
                if (performanceChart) {
                    performanceChart.destroy();
                    performanceChart = null;
                }
                
                // 显示提示信息
                const ctx = document.getElementById('performance-chart').getContext('2d');
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.font = '16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#666';
                ctx.fillText('请选择至少一个产品以查看性能对比', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }
            
            let title;
            
            // 根据图表类型准备数据
            if (chartType === 'cpuSingle') {
                title = 'CPU单核性能对比';
                // 提取单核性能数据
                selectedProductsData = selectedProductsData.map(p => {
                    let score = 0;
                    if (p.cpuPerformance && typeof p.cpuPerformance === 'object' && p.cpuPerformance.singleCore) {
                        score = p.cpuPerformance.singleCore;
                    } else if (typeof p.cpuSingleCore === 'number') {
                        score = p.cpuSingleCore;
                    }
                    return { name: p.name, score: score };
                });
            } else if (chartType === 'cpuMulti') {
                title = 'CPU多核性能对比';
                // 提取多核性能数据
                selectedProductsData = selectedProductsData.map(p => {
                    let score = 0;
                    if (p.cpuPerformance && typeof p.cpuPerformance === 'object' && p.cpuPerformance.multiCore) {
                        score = p.cpuPerformance.multiCore;
                    } else if (typeof p.cpuMultiCore === 'number') {
                        score = p.cpuMultiCore;
                    }
                    return { name: p.name, score: score };
                });
            } else { // gpu
                title = 'GPU性能对比';
                // 提取GPU性能数据
                selectedProductsData = selectedProductsData.map(p => {
                    return { name: p.name, score: p.gpuPerformance || 0 };
                });
            }
            
            // 按性能从高到低排序
            selectedProductsData.sort((a, b) => b.score - a.score);
            
            // 准备图表数据
            const labels = selectedProductsData.map(p => p.name);
            const scores = selectedProductsData.map(p => p.score);
            
            // 设置图表颜色
            const backgroundColors = [
                'rgba(0, 113, 227, 0.7)', // Apple蓝
                'rgba(255, 59, 48, 0.7)', // Apple红
                'rgba(52, 199, 89, 0.7)',  // Apple绿
                'rgba(255, 149, 0, 0.7)',  // Apple橙
                'rgba(175, 82, 222, 0.7)', // Apple紫
                'rgba(90, 200, 250, 0.7)'  // Apple天蓝
            ];
            
            // 如果图表已存在，销毁它
            if (performanceChart) {
                performanceChart.destroy();
            }
            
            // 创建新图表（横向柱状图）
            const ctx = document.getElementById('performance-chart').getContext('2d');
            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: scores,
                        backgroundColor: backgroundColors.slice(0, labels.length),
                        borderColor: backgroundColors.map(color => color.replace('0.7', '1')),
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y', // 设置为横向柱状图
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: title,
                            font: {
                                size: 16,
                                family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif'
                            },
                            padding: {
                                bottom: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ${context.raw}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '性能得分',
                                font: {
                                    size: 14,
                                    family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif'
                                },
                                padding: {
                                    top: 10
                                }
                            },
                            grid: {
                                drawBorder: false
                            }
                        },
                        y: {
                            title: {
                                display: false
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                autoSkip: false,
                                maxRotation: 0,
                                minRotation: 0,
                                padding: 10,
                                callback: function(value) {
                                    const label = this.getLabelForValue(value);
                                    return label;
                                },
                                font: {
                                    size: 12
                                }
                            }
                        }
                    },
                    layout: {
                        padding: {
                            top: 20,
                            right: 20,
                            bottom: 20,
                            left: 20
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
            
            // 调整图表大小以适应容器
            const resizeChart = () => {
                const barHeight = 30;
                const minHeight = 200;
                const dataLength = performanceChart.data.labels.length;
                const calculatedHeight = Math.max(minHeight, dataLength * barHeight);
                performanceChart.canvas.parentNode.style.height = `${calculatedHeight}px`;
                performanceChart.resize();
            };
            
            resizeChart();
            window.addEventListener('resize', resizeChart);
        }
        
        // 更新性能图表（页面底部的固定图表）
        function updatePerformanceCharts() {
            // 只更新当前选中的图表类型
            updatePerformanceChart(currentChartType);
        }
        
        // 在页面加载完成后初始化图表切换按钮
        document.addEventListener('DOMContentLoaded', function() {
            initChartTabs();
            
            // 模态框图表选项卡点击事件
            document.querySelectorAll('.modal-chart .chart-tabs .chart-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    // 移除所有选项卡的活动状态
                    document.querySelectorAll('.modal-chart .chart-tabs .chart-tab').forEach(t => {
                        t.classList.remove('active');
                    });
                    // 添加当前选项卡的活动状态
                    this.classList.add('active');
                    // 更新图表
                    updatePerformanceChart(this.dataset.chart);
                });
            });
        });
        
        // 兼容性函数 - GPU性能图表
        function updateGPUPerformanceChart() {
            // 直接调用新的统一图表函数
            updatePerformanceChart('gpu');
        }
        
        // 兼容性函数 - 单核性能图表
        function updateCPUSinglePerformanceChart() {
            updatePerformanceChart('cpuSingle');
        }
        
        // 兼容性函数 - 多核性能图表
        function updateCPUMultiPerformanceChart() {
            updatePerformanceChart('cpuMulti');
        }

        // 显示错误消息
        function displayErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            
            const container = document.querySelector('.main-content .container');
            container.prepend(errorDiv);
            
            // 5秒后自动消失
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
