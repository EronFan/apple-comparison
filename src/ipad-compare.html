                this._selectedProducts = [...products];

                if (!this._selectedProducts.includes(productId)) {
                    this._selectedProducts.push(productId);
                    this._notifySubscribers();
                }
            },
            
            // 移除产品
            removeProduct(productId) {
                const index = this._selectedProducts.indexOf(productId);
                if (index > -1) {
                    this._selectedProducts.splice(index, 1);
                    this._notifySubscribers();
                }
            },
            
            // 重置产品选择
            resetProducts(allProductIds) {
                this._selectedProducts = [...allProductIds];
                this._notifySubscribers();
            },
            
            // 订阅状态变更
            subscribe(callback) {
                if (typeof callback === 'function' && !this._subscribers.includes(callback)) {
                    this._subscribers.push(callback);
                }
            },
            
            // 取消订阅
            unsubscribe(callback) {
                const index = this._subscribers.indexOf(callback);
                if (index > -1) {
                    this._subscribers.splice(index, 1);
                }
            },
            
            // 通知所有订阅者
            _notifySubscribers() {
                this._subscribers.forEach(callback => callback(this._selectedProducts));
            }

        // 获取参数的本地化名称
        function getLocalizedParamName(paramKey, language) {
            if (paramNameTranslations[paramKey] && paramNameTranslations[paramKey][language]) {
                return paramNameTranslations[paramKey][language];
            }
            return paramKey; // 如果没有找到翻译，返回参数键名
        }

        // 获取本地化文本
        function getLocalizedText(value, language) {
            if (!value) return '';
            if (typeof value === 'string') return value;
            if (typeof value === 'object' && value[language]) {
                return value[language];
            }
            return value;
        }

        // 获取本地化值（兼容函数）
        function getLocalizedValue(value, language) {
            return getLocalizedText(value, language);

        // 初始化产品状态管理对象，确保在全局范围内可用
        if (typeof window.productState === 'undefined') {

        // 定义重新加载数据函数（由language-switcher.js直接调用）
        window.reloadDataWithLanguage = async function(language) {
            // 开始使用新语言重新加载数据
            window.currentLanguage = language;
            
            // 隐藏之前的错误信息（如果有）
            const errorElement = document.getElementById('error-message');
            if (errorElement) {
                errorElement.style.display = 'none';
            }
            
            try {
                // 重新加载数据从原始源
                // 重新从源加载数据文件
                const response = await fetch('/public/data/ipad_refined.json?v=20261123'); // 添加缓存破坏参数
                
                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }
                
                const jsonData = await response.json();
                // 数据加载完成
                
                // 处理双语数据
                const firstProduct = jsonData[0];
                const productName = getLocalizedText(firstProduct.name, language);
                const processor = getLocalizedText(firstProduct.processor, language);
                
                // 定义产品系列的优先级
                const seriesPriority = {
                    'Pro': 1,
                    'Air': 2,
                    'Mini': 3,
                    'Standard': 4
                };
                
                // 按产品系列优先，然后按发布日期降序排序
                window.allProducts = jsonData.sort((a, b) => {
                    // 获取产品系列
                    const seriesA = a.series || 'Standard';
                    const seriesB = b.series || 'Standard';
                    
                    // 获取系列优先级
                    const priorityA = seriesPriority[seriesA] || 4;
                    const priorityB = seriesPriority[seriesB] || 4;
                    
                    // 首先按系列优先级排序
                    if (priorityA !== priorityB) {
                        return priorityA - priorityB;
                    }
                    
                    // 系列相同时，按发布日期降序排序
                    // 获取日期字符串，处理可能的双语格式
                    const releaseDateA = typeof a.releaseDate === 'object' ? a.releaseDate['zh-CN'] : a.releaseDate;
                    const releaseDateB = typeof b.releaseDate === 'object' ? b.releaseDate['zh-CN'] : b.releaseDate;
                    
                    // 将日期格式从 YYYY.MM.DD 转换为 YYYY-MM-DD
                    const dateA = new Date(releaseDateA.split('.').reverse().join('-'));
                    const dateB = new Date(releaseDateB.split('.').reverse().join('-'));
                    return dateB - dateA;
                });
                
                // 清除当前表格
                const table = document.querySelector('table');
                if (table) {
                    const thead = table.querySelector('thead tr');
                    const tbody = table.querySelector('tbody');
                    
                    if (thead) {
                        // 清除表头，保留第一列（参数名称列）
                        while (thead.children.length > 1) {
                            thead.removeChild(thead.lastChild);
                        }
                    }
                    
                    if (tbody) {
                        tbody.innerHTML = '';
                    }
                }
                
                // 重新生成表格
                // 使用新语言重新生成表格
                generateTable(window.allProducts);
                
                // 确保所有产品都处于非勾选状态
                // 重置所有产品为非勾选状态
                document.querySelectorAll('input[type="checkbox"].product-selector').forEach(checkbox => {
                    checkbox.checked = false;
                });
                
                // 确保所有产品都显示
                document.querySelectorAll('.product-column').forEach(column => {
                    column.style.display = '';
                });
                
                // 更新参数差异高亮

                    updateParameterDifferences();

                // 更新图表

                    updatePerformanceCharts();

                return true;

            }
        };

        // 加载产品数据
        async function loadProductData() {
            try {
                // 开始加载 iPad 参数数据文件
                // 使用iPad参数数据文件
                const response = await fetch('/public/data/ipad_refined.json?v=20261123');
                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }
                const data = await response.json();
                // 成功加载 iPad 型号数据
                
                // 处理双语数据
                const firstProduct = data[0];
                const productName = getLocalizedText(firstProduct.name, currentLanguage);
                const processor = getLocalizedText(firstProduct.processor, currentLanguage);
                
                // 定义产品系列的优先级
                const seriesPriority = {
                    'Pro': 1,
                    'Air': 2,
                    'Mini': 3,
                    'Standard': 4
                };
                
                // 按产品系列优先，然后按发布日期降序排序
                window.allProducts = data.sort((a, b) => {
                    // 获取产品系列
                    const seriesA = a.series || 'Standard';
                    const seriesB = b.series || 'Standard';
                    
                    // 获取系列优先级
                    const priorityA = seriesPriority[seriesA] || 4;
                    const priorityB = seriesPriority[seriesB] || 4;
                    
                    // 首先按系列优先级排序

                    }
                    
                    // 系列相同时，按发布日期降序排序

                    // 将日期格式从 YYYY.MM.DD 转换为 YYYY-MM-DD

                    const dateB = new Date(releaseDateB.split('.').reverse().join('-'));
                    return dateB - dateA;
                });

        // 生成表格
        function generateTable(products) {
            // 开始生成iPad产品参数表格
            // 处理产品数量信息
            const tableContainer = document.querySelector('.params-table');
            const thead = document.querySelector('table thead tr');
            // 清空现有表头，保留第一列（参数名称列）

            }
            
            // 添加产品列

                checkbox.className = 'product-checkbox';

            // 移动端表格生成

                if (window.innerWidth <= 768) {
                    generateMobileTable();
                }

                        // 定义要显示的参数列表

            const params = [
                // 基本信息
                { key: 'marketingSlogan', name: '宣传口号', langKey: 'param.marketingSlogan', icon: 'ri-advertisement-line' },

                { key: 'dimensions', name: '尺寸', langKey: 'param.dimensions', icon: 'ri-ruler-line', formatter: val => {

                    return parts.length > 1 ? parts[1].trim() : '/';
                } },
                // 已移除防水等级参数
                // 增强现实参数已隐藏
                // { key: 'arSupport', name: '增强现实', langKey: 'param.arSupport', icon: 'ri-augmented-reality-line' },

                { key: 'benchmarks.singleCore', name: 'Geekbench 单核跑分', langKey: 'param.benchmarks.singleCore', icon: 'ri-cpu-line' },
                { key: 'benchmarks.multiCore', name: 'Geekbench 多核跑分', langKey: 'param.benchmarks.multiCore', icon: 'ri-cpu-line' },
                { key: 'benchmarks.gpu', name: 'Geekbench GPU跑分', langKey: 'param.benchmarks.gpu', icon: 'ri-gpu-line' },

                { key: 'processor', name: '处理器型号', langKey: 'param.processor', icon: 'ri-cpu-line' },
                { key: 'ram', name: '内存容量', langKey: 'param.ram', icon: 'ri-database-2-line' },
                { key: 'ramType', name: '内存规格', langKey: 'param.ramType', icon: 'ri-chip-line' },
                { key: 'storage', name: '存储容量', langKey: 'param.storage', formatter: val => Array.isArray(val) ? val.join(', ') : val, icon: 'ri-hard-drive-line' },

                { key: 'displayRefreshRate', name: '屏幕刷新率', langKey: 'param.displayRefreshRate', icon: 'ri-refresh-line' },
                { key: 'displayBrightness', name: '亮度', langKey: 'param.displayBrightness', icon: 'ri-sun-line' },

                { key: 'camera', name: '后置摄像头', langKey: 'param.camera', icon: 'ri-camera-line', formatter: val => {

                { key: 'ports', name: '接口类型', langKey: 'param.ports', icon: 'ri-usb-line' },
                { key: 'baseband', name: '基带芯片', langKey: 'param.baseband', icon: 'ri-base-station-line' },
                { key: 'wifiStandard', name: 'Wi-Fi标准', langKey: 'param.wifiStandard', icon: 'ri-wifi-line' },
                { key: 'bluetoothVersion', name: '蓝牙版本', langKey: 'param.bluetoothVersion', icon: 'ri-bluetooth-line' },
                { key: 'security', name: '解锁方式', langKey: 'param.security', icon: 'ri-fingerprint-line' },
                
                // 电池和充电
                { key: 'batteryCapacity', name: '电池容量', langKey: 'param.batteryCapacity', icon: 'ri-battery-2-line' },
                { key: 'batteryLife', name: '续航时长', langKey: 'param.batteryLife', icon: 'ri-battery-charge-line', formatter: val => {
                    if (!val) return val;
                    
                    // 处理双语格式的文本
                    let batteryText = typeof val === 'object' ? getLocalizedText(val, currentLanguage) : val;
                    if (!batteryText) return '/';
                    
                    // 处理多种可能的格式，确保正确换行
                    if (currentLanguage === 'zh-CN') {
                        return batteryText.replace(/无线局域网浏览网页：(\d+)h/g, '无线局域网浏览网页：$1h<br>')
                                   .replace(/蜂窝网络浏览网页：(\d+)h/g, '蜂窝网络浏览网页：$1h');
                    } else if (currentLanguage === 'en-US') {
                        return batteryText.replace(/Wi-Fi web browsing: (\d+)h/g, 'Wi-Fi web browsing: $1h<br>')
                                   .replace(/Cellular web browsing: (\d+)h/g, 'Cellular web browsing: $1h');
                    }
                    
                    return batteryText;
                } },
                
                // 音频系统
                { key: 'audioFeatures', name: '音频功能', langKey: 'param.audioFeatures', icon: 'ri-volume-up-line' },
                
                // 其他信息
                { key: 'series', name: '产品系列', langKey: 'param.series', icon: 'ri-apple-line' },
                { key: 'technicalSpecsLink', name: '技术规格链接', langKey: 'param.technicalSpecsLink', formatter: val => {
                  if (!val) return '-';
                  if (typeof val === 'string') return `<a href="${val}" target="_blank" rel="noopener noreferrer">查看详情</a>`;
                  if (val.url) {
                    // 处理双语格式的文本
                    let linkText = val.text;
                    if (typeof linkText === 'object') {
                      linkText = getLocalizedText(linkText, currentLanguage);
                    }
                    return `<a href="${val.url}" target="_blank" rel="noopener noreferrer">${linkText || '查看详情'}</a>`;
                  }
                  return '-';
                }, icon: 'ri-links-line' }
            ];
            
            // 检查特定参数的图标配置
            // 参数图标检查已在开发阶段完成，上线前移除
            
            // 过滤隐藏的参数
            const visibleParams = params.filter(param => !param.hidden);
            
            // 为每个可见参数创建行
            visibleParams.forEach((param, index) => {
                const tr = document.createElement('tr');
                
                // 添加行交替颜色
                if (index % 2 === 1) {
                    tr.classList.add('alt-row');
                }
                
                // 每第三个参数添加组间距
                if (index % 3 === 0) {
                    tr.classList.add('group-separator');
                }
                
                // 参数名称单元格
                const tdName = document.createElement('td');
                tdName.className = 'param-name';
                tdName.setAttribute('data-lang-key', param.langKey);
                
                // 添加图标
                if (param.icon) {
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'param-icon';
                    const icon = document.createElement('i');
                    icon.className = param.icon;
                    iconSpan.appendChild(icon);
                    tdName.appendChild(iconSpan);
                    
                    // 获取本地化参数名称
                    const localizedParamName = getLocalizedParamName(param.langKey, currentLanguage);
                    
                    // 添加文本节点
                    const textSpan = document.createElement('span');
                    textSpan.className = 'param-text';
                    textSpan.setAttribute('data-param-key', param.langKey); // 添加参数键属性以便语言切换
                    textSpan.textContent = localizedParamName; // 使用本地化参数名称
                    tdName.appendChild(textSpan);
                } else {
                    // 获取本地化参数名称
                    const localizedParamName = getLocalizedParamName(param.langKey, currentLanguage);
                    tdName.textContent = localizedParamName; // 使用本地化参数名称
                }
                
                tr.appendChild(tdName);
                
                // 为每个产品添加参数值单元格
                products.forEach(product => {
                    const tdValue = document.createElement('td');
                    tdValue.className = 'param-value';
                    tdValue.setAttribute('data-product', product.id);
                    
                    // 支持嵌套属性访问（如cpuPerformance.singleCore）
                    // 获取参数值，支持嵌套属性
                    let value = getNestedProperty(product, param.key);
                    
                    // 处理双语数据
                    value = getLocalizedText(value, currentLanguage);
                    
                    // 记录iPad特有参数的值
                    if (['pencilSupport', 'keyboardSupport', 'lidar'].includes(param.key) && value !== undefined && value !== null) {
                        const productName = getLocalizedText(product.name, currentLanguage);
                        // 产品参数值处理
                    }
                    
                    if (value !== undefined && value !== null) {
                        // 如果有格式化函数，使用它处理值
                        if (param.formatter) {
                            value = param.formatter(value);
                            // 如果格式化后的值包含HTML标签（如超链接），使用innerHTML
                            if (typeof value === 'string' && value.includes('<')) {
                                tdValue.innerHTML = value;
                            } else {
                                tdValue.textContent = value;
                            }
                        } else {
                            tdValue.textContent = value;
                        }
                    } else {
                        tdValue.textContent = '-';
                        tdValue.classList.add('empty-value');
                    }
                    
                    tr.appendChild(tdValue);
                });
                
                tbody.appendChild(tr);
            });
            
            // 初始化表格后翻译界面
            if (typeof initLanguage === 'function') {
                initLanguage();
            }
        }

        // 支持嵌套属性访问（如cpuPerformance.singleCore），供表格生成与语言切换共用
        function getNestedProperty(obj, path) {
            return path.split('.').reduce((prev, curr) =>
                prev && prev[curr] !== undefined ? prev[curr] : null, obj);
        }

        // 初始化产品选择 - 拆分为初始化和事件绑定两个独立函数
        function initProductSelection() {
            // 1. 初始化产品选择状态
            initProductState();
            
            // 2. 绑定产品选择事件处理器
            bindProductSelectionEvents();
        }

        // 初始化产品状态
        function initProductState() {
            const checkboxes = document.querySelectorAll('.product-checkbox');
            
            // 收集所有产品ID
            const allProductIds = Array.from(checkboxes).map(checkbox => checkbox.id);
            
            // 设置所有复选框为非选中状态
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
                
                // 移除选中样式
                const productElement = checkbox.closest('.product-selector');
                if (productElement) {
                    productElement.classList.remove('selected');
                }
            });
            
            // 使用状态管理系统重置产品选择，但不选择任何产品
            AppState.selectedProducts = [];
            
            // 输出初始化状态信息
            // 产品选择初始化完成
        }

        // 绑定产品选择事件
        function bindProductSelectionEvents() {
            const checkboxes = document.querySelectorAll('.product-checkbox');
            
            checkboxes.forEach(checkbox => {
                // 移除可能存在的旧事件监听器，避免重复绑定
                checkbox.removeEventListener('change', handleProductSelectionChange);
                
                // 添加新的事件监听器
                checkbox.addEventListener('change', handleProductSelectionChange);
            });
        }

        // 产品选择变更事件处理函数
        function handleProductSelectionChange() {
            const productId = this.id;
            const productElement = this.closest('.product-selector');
            const currentSelectedProducts = AppState.selectedProducts;
            
            // 检查当前状态，避免重复操作
            if (this.checked) {
                // 确保不重复添加
                if (!currentSelectedProducts.includes(productId)) {
                    AppState.addProduct(productId);
                    // 添加产品处理
                }
                productElement.classList.add('selected');
            } else {
                // 确保产品存在才移除
                if (currentSelectedProducts.includes(productId)) {
                    AppState.removeProduct(productId);
                    // 移除产品处理
                }
                productElement.classList.remove('selected');
            }
            
            // 调试输出当前选中的产品
            // 当前选中的产品状态更新
        }

        // 更新参数差异高亮
        // 更新产品显示（用于语言切换）
        function updateProductDisplay(lang) {
            // 更新产品显示处理
            
            // 更新产品名称
            document.querySelectorAll('.product-name').forEach(label => {
                const productId = label.getAttribute('for');
                const product = allProducts.find(p => p.id === productId);
                if (product) {
                    label.textContent = getLocalizedText(product.name, lang);
                }
            });
            
            // 更新参数值
            document.querySelectorAll('td.param-value').forEach(cell => {
                const productId = cell.getAttribute('data-product');
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                
                // 找到对应的参数名称（名称为中英对象，按当前语言比对）
                const row = cell.closest('tr');
                const paramNameCell = row.querySelector('.param-name');
                const paramText = paramNameCell.querySelector('.param-text')?.textContent || paramNameCell.textContent;
                const param = getCompleteParamDefinitions().find(p =>
                    p.name === paramText || p.name[lang] === paramText || p.name['zh-CN'] === paramText
                );
                
                if (param && param.key) {
                    // 获取参数值
                    let value = getNestedProperty(product, param.key);
                    value = getLocalizedText(value, lang);
                    
                    // 应用格式化
                    if (param.formatter) {
                        value = param.formatter(value);
                        if (typeof value === 'string' && value.includes('<')) {
                            cell.innerHTML = value;
                        } else {
                            cell.textContent = value || '-';
                        }
                    } else {
                        cell.textContent = value || '-';
                    }
                    
                    // 如果值为空，添加空值样式
                    if (!value) {
                        cell.classList.add('empty-value');
                    } else {
                        cell.classList.remove('empty-value');
                    }
                }
            });
            
            // 更新参数差异高亮
            updateParameterDifferences();
        }
        
        function updateParameterDifferences(products) {
            // 更新参数差异高亮处理
            // 如果没有传入产品，使用当前选中的产品
            if (!products) {
                // 修复productSelectionState引用错误，改用window.productState
                if (window.productState && typeof window.productState.selectedProducts === 'function') {
                    products = allProducts.filter(p => window.productState.selectedProducts().includes(p.id));
                } else {
                    // 备用方法：直接从DOM中获取选中的产品
                    const checkboxes = document.querySelectorAll('input[type="checkbox"].product-selector:checked');
                    const selectedIds = Array.from(checkboxes).map(cb => cb.id);
                    products = allProducts.filter(p => selectedIds.includes(p.id));
                }
            }
            // 清除所有高亮样式
            document.querySelectorAll('td.param-value.highlight-diff').forEach(cell => {
                cell.classList.remove('highlight-diff');
            });
            
            // 安全地获取选中的产品ID
            let selectedProductIds = [];
            if (products && products.length > 0) {
                selectedProductIds = products.map(p => p.id);
            } else if (window.productState && typeof window.productState.selectedProducts === 'function') {
                selectedProductIds = window.productState.selectedProducts();
            } else {
                // 备用方法：直接从DOM获取
                const checkboxes = document.querySelectorAll('input[type="checkbox"].product-selector:checked');
                selectedProductIds = Array.from(checkboxes).map(cb => cb.id);
            }
            
            // 如果选中的产品少于2个，直接返回（已清除所有高亮）
            if (selectedProductIds.length < 2) return;
            
            const tbody = document.querySelector('table tbody');
            const rows = tbody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const cells = row.querySelectorAll('td.param-value');
                const visibleCells = Array.from(cells).filter(cell => {
                    const productId = cell.getAttribute('data-product');
                    return selectedProductIds.includes(productId);
                });
                
                if (visibleCells.length >= 2) {
                    // 获取第一个可见单元格的值作为参考
                    const referenceValue = visibleCells[0].textContent;
                    
                    // 检查是否所有值都相同
                    const allSame = visibleCells.every(cell => cell.textContent === referenceValue);
                    
                    // 如果值不同，高亮显示不同的单元格
                    if (!allSame) {
                        visibleCells.forEach(cell => {
                            cell.classList.add('highlight-diff');
                        });
                    }
                }
            });
        }

        // 绑定事件
        function bindEvents() {
            // 重置按钮事件
            const resetButton = document.getElementById('reset-button');
            if (resetButton) {
                resetButton.removeEventListener('click', handleResetButtonClick); // 移除可能存在的旧事件监听器
                resetButton.addEventListener('click', handleResetButtonClick);
            }
            
            // 对比按钮事件
            const compareButton = document.getElementById('compare-button');
            if (compareButton) {
                compareButton.removeEventListener('click', handleCompareButtonClick); // 移除可能存在的旧事件监听器
                compareButton.addEventListener('click', handleCompareButtonClick);
            }
            
            // 移动端事件绑定
            bindMobileEvents();
            
            // 添加按钮点击动画
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    this.classList.add('btn-pressed');
                    setTimeout(() => {
                        this.classList.remove('btn-pressed');
                    }, 200);
                });
            });
        }
        
        // 移动端事件处理
        function bindMobileEvents() {
            // 滑动导航按钮
            const mobilePrevBtn = document.querySelector('.mobile-nav-prev');
            const mobileNextBtn = document.querySelector('.mobile-nav-next');
            const mobileProductsScroll = document.querySelector('.mobile-products-scroll');

            if (mobilePrevBtn) {
                mobilePrevBtn.addEventListener('click', () => scrollMobileProducts('prev'));
            }
            
            if (mobileNextBtn) {
                mobileNextBtn.addEventListener('click', () => scrollMobileProducts('next'));
            }

            if (mobileProductsScroll) {
                // 监听滚动事件以更新指示器
                mobileProductsScroll.addEventListener('scroll', updateScrollIndicators);
                
                // 触摸事件处理
                let startX = 0;
                let scrollStart = 0;
                
                mobileProductsScroll.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    scrollStart = mobileProductsScroll.scrollLeft;
                });
                
                mobileProductsScroll.addEventListener('touchmove', (e) => {
                    if (!startX) return;
                    
                    const currentX = e.touches[0].clientX;
                    const diff = startX - currentX;
                    mobileProductsScroll.scrollLeft = scrollStart + diff;
                });
                
                mobileProductsScroll.addEventListener('touchend', () => {
                    startX = 0;
                    scrollStart = 0;
                });
            }

            // 监听屏幕尺寸变化
            window.addEventListener('resize', handleScreenResize);
            
            // 初始化移动端界面
            handleScreenResize();
            
            // 确保移动端表格在数据加载后生成
            setTimeout(() => {
                if (window.innerWidth <= 768) {
                    generateMobileTable();
                }
            }, 800);
            
            // 额外的强制初始化，确保移动端表格一定会生成
            setTimeout(() => {
                checkAndInitMobileTable();
            }, 1500);
            
            // 最终检查
            setTimeout(() => {
                checkAndInitMobileTable();
            }, 3000);
        }

        // 处理屏幕尺寸变化
        function handleScreenResize() {
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                // 延迟初始化，确保数据已加载
                setTimeout(() => {
                    initializeMobileView();
                }, 100);
            }
        }

        // 初始化移动端视图
        // 当前对比选中的机型（重建移动端表格后据此恢复勾选与显隐）
        let currentSelectedIds = [];

        // 初始化移动端视图
        function initializeMobileView() {
            // 已构建过则不再重建：手机端滚动会收起地址栏触发 resize，
            // 若在此重建表格会丢失对比选择，恢复为全部机型
            const container = document.getElementById('mobileProductsContainer');
            const paramsColumn = document.getElementById('mobileParamsColumn');
            if (container && container.children.length > 0 && paramsColumn && paramsColumn.children.length > 0) {
                updateScrollIndicators();
                updateNavigationButtons();
                return;
            }
            generateMobileTable();
            updateScrollIndicators();

        // 移动端行高对齐：参数列与产品列按行取最大高度对齐
        function syncMobileRowHeights() {
            const paramsColumn = document.getElementById('mobileParamsColumn');
            const productsContainer = document.getElementById('mobileProductsContainer') || document.querySelector('.mobile-products-container');
            if (!paramsColumn || !productsContainer) return;
            const paramRows = paramsColumn.querySelectorAll(':scope > .mobile-table-row');
            const productColumns = productsContainer.querySelectorAll(':scope > .mobile-product-column');
            paramsColumn.querySelectorAll('.mobile-table-row, .mobile-cell').forEach(el => { el.style.height = 'auto'; });
            productColumns.forEach(col => {
                col.querySelectorAll('.mobile-table-row, .mobile-cell').forEach(el => { el.style.height = 'auto'; });
            });
            for (let i = 0; i < paramRows.length; i++) {
                const cells = [];
                if (paramRows[i]) paramRows[i].querySelectorAll('.mobile-cell').forEach(c => cells.push(c));
                productColumns.forEach(col => {
                    if (col.style.display === 'none') return;
                    const r = col.querySelectorAll(':scope > .mobile-table-row')[i];
                    if (r) r.querySelectorAll('.mobile-cell').forEach(c => cells.push(c));
                });
                let maxH = 0;
                cells.forEach(c => { const h = c.offsetHeight || 0; if (h > maxH) maxH = h; });
                if (maxH > 0) {
                    if (paramRows[i]) {
                        paramRows[i].style.height = maxH + 'px';
                        paramRows[i].querySelectorAll('.mobile-cell').forEach(c => c.style.height = maxH + 'px');
                    }
                    productColumns.forEach(col => {
                        const r = col.querySelectorAll(':scope > .mobile-table-row')[i];
                        if (r) {
                            r.style.height = maxH + 'px';
                            r.querySelectorAll('.mobile-cell').forEach(c => c.style.height = maxH + 'px');
                        }
                    });
                }
            }
        }

        // 生成移动端产品列
        function generateMobileProductColumns() {
            const productsContainer = document.querySelector('.mobile-table-body .mobile-products-container');
            if (!productsContainer) {
                console.error('未找到移动端产品容器');
                return;
            }

            // 清空现有内容
            productsContainer.innerHTML = '';

            // 为每个产品创建列
            window.allProducts.forEach(product => {
                const column = createMobileProductColumn(product);
                productsContainer.appendChild(column);
            });

            // 重建后恢复对比选择（勾选状态 + 列显隐），避免丢失已选机型
            if (currentSelectedIds.length > 0) {
                window.allProducts.forEach(product => {
                    const selected = currentSelectedIds.includes(product.id);
                    const mobileCheckbox = productsContainer.querySelector(`.mobile-product-checkbox[data-product-id="${product.id}"]`);
                    if (mobileCheckbox) mobileCheckbox.checked = selected;
                    const desktopCheckbox = document.querySelector(`input[type="checkbox"][id="${product.id}"]`);
                    if (desktopCheckbox) desktopCheckbox.checked = selected;
                });
                hideUnselectedProducts(currentSelectedIds);
            }

        // 创建移动端产品列
        function createMobileProductColumn(product) {
            const column = document.createElement('div');
            column.className = 'mobile-product-column';
            column.dataset.productId = product.id;

            const currentLang = window.currentLanguage || 'zh-CN';
            const productName = getLocalizedValue(product.name, currentLang) || product.name;

            // 添加产品头部
            const headerRow = document.createElement('div');
            headerRow.className = 'mobile-table-row';

            headerRow.innerHTML = `
                <div class="mobile-cell mobile-product-header" style="height: 90px;">
                    <div class="mobile-product-selector">
                        <input type="checkbox" class="mobile-product-checkbox" id="mobile-${product.id}" data-product-id="${product.id}">
                        <label for="mobile-${product.id}" class="mobile-product-name">${productName}</label>
                    </div>
                </div>
            `;
            // 产品图行（无图时隐藏占位，保持列对齐）
            const imgRow = document.createElement('div');
            imgRow.className = 'mobile-table-row mobile-image-row';
            if (product.image) {
                imgRow.innerHTML = `
                    <div class="mobile-cell" style="height: auto; justify-content: center;">
                        <img class="mobile-thumb" src="/public/images/products/${product.image}" alt="${productName}" loading="lazy" onerror="this.closest('.mobile-table-row').style.display='none'">
                    </div>
                `;
            } else {
                imgRow.style.display = 'none';
            }
            column.appendChild(headerRow);

            // 添加参数行
            const paramDefinitions = getCompleteParamDefinitions();
            paramDefinitions.forEach(param => {
                const row = document.createElement('div');
                row.className = 'mobile-table-row';
                row.style.height = '50px';
                
                const value = getProductParamValue(product, param.key, currentLang);
                const formattedValue = formatMobileParamValue(value, param.key, currentLang);
                
                row.innerHTML = `
                    <div class="mobile-cell mobile-value-cell" style="height: 50px; align-items: center; justify-content: flex-start;">
                        ${formattedValue}
                    </div>
                `;
                column.appendChild(row);
            });

            // 为移动端勾选框添加事件处理
            const mobileCheckbox = column.querySelector('.mobile-product-checkbox');
            if (mobileCheckbox) {
                mobileCheckbox.addEventListener('change', function() {
                    // 同步到桌面端勾选框
                    const desktopCheckbox = document.querySelector(`input[type="checkbox"][id="${product.id}"]`);
                    if (desktopCheckbox) {
                        desktopCheckbox.checked = this.checked;
                    }
                    
                    // 更新产品选择状态
                    updateProductSelection();
                });
            }

            return column;
        }

        // 获取产品参数值
        function getProductParamValue(product, paramKey, language) {
            if (paramKey === 'mainCamera' || paramKey === 'telephotoCamera' || paramKey === 'ultraWideCamera') {
                // 处理摄像头参数
                const cameraValue = product.camera || '';
                // 确保cameraValue是字符串类型
                const cameraString = typeof cameraValue === 'string' ? cameraValue : String(cameraValue || '');
                
                if (paramKey === 'mainCamera') {
                    const mainMatch = cameraString.match(/主摄像头[：:]\s*([^，,]+)/);
                    return mainMatch ? mainMatch[1].trim() : '';
                } else if (paramKey === 'telephotoCamera') {
                    const teleMatch = cameraString.match(/长焦[：:]\s*([^，,]+)/);
                    return teleMatch ? teleMatch[1].trim() : '';
                } else if (paramKey === 'ultraWideCamera') {
                    const ultraMatch = cameraString.match(/广角[：:]\s*([^，,]+)/);
                    return ultraMatch ? ultraMatch[1].trim() : '';
                }
            }
            
            // 处理嵌套属性
            if (paramKey.includes('.')) {
                const keys = paramKey.split('.');
                let value = product;
                for (const key of keys) {
                    value = value?.[key];
                }
                // 处理双语数据
                return getLocalizedText(value, language);
            }
            
            // 获取参数值
            let value = product[paramKey];
            
            // 处理双语数据
            return getLocalizedText(value, language);
        }

        // 格式化移动端参数值
        function formatMobileParamValue(value, paramKey, language) {
            if (!value) return '-';
            
            // 处理颜色参数
            if (paramKey === 'colors' && Array.isArray(value)) {
                return value.map(color => {
                    const colorName = getLocalizedValue(color.name, language) || color.name;
                    const colorCode = color.code || '#000000';
                    return `<span class="color-sample" style="background-color: ${colorCode};" title="${colorName}"></span>`;
                }).join('');
            }
            
            // 处理技术规格链接
            if (paramKey === 'technicalSpecsLink' && value) {
                return `<a href="${value}" target="_blank" style="color: black; text-decoration: underline;">查看详情</a>`;
            }
            
            // 处理PPI参数
            if (paramKey === 'displayPpi' && value) {
                return `${value} PPI`;
            }

            // Apple Pencil分项换行（与桌面端一致）
            if (paramKey === 'pencilSupport' && value) {
                const items = pencilItems(value, language);
                return items.length ? items.join('<br>') : '/';
            }
            
            // 处理多语言值
            if (typeof value === 'object' && value[language]) {
                return value[language];
            }
            
            return value;
        }

        // 生成滚动指示器
        function generateScrollIndicators() {
            const indicatorsContainer = document.querySelector('.mobile-scroll-indicators');
            if (!indicatorsContainer) return;

            indicatorsContainer.innerHTML = '';
            
            // 根据产品数量生成指示器
            const productCount = window.allProducts.length;
            const maxVisible = 3; // 最多显示3个产品
            const pageCount = Math.ceil(productCount / maxVisible);
            
            for (let i = 0; i < pageCount; i++) {
                const indicator = document.createElement('div');
                indicator.className = 'mobile-scroll-indicator';
                if (i === 0) indicator.classList.add('active');
                indicator.addEventListener('click', () => scrollToPage(i));
                indicatorsContainer.appendChild(indicator);
            }
        }

        // 滚动到指定页面
        function scrollToPage(pageIndex) {
            const productsScroll = document.querySelector('.mobile-products-scroll');
            if (!productsScroll) return;

            const productWidth = 140; // 产品列宽度
            const maxVisible = 3; // 最多显示3个产品
            const scrollLeft = pageIndex * (productWidth * maxVisible);
            
            productsScroll.scrollTo({
                left: scrollLeft,
                behavior: 'smooth'
            });
        }

        // 滚动移动端产品
        function scrollMobileProducts(direction) {
            const productsScroll = document.querySelector('.mobile-products-scroll');
            if (!productsScroll) return;

            const scrollAmount = 140; // 一个产品列的宽度
            const currentScroll = productsScroll.scrollLeft;
            const newScroll = direction === 'next' 
                ? currentScroll + scrollAmount 
                : currentScroll - scrollAmount;
            
            productsScroll.scrollTo({
                left: newScroll,
                behavior: 'smooth'
            });
        }

        // 更新滚动指示器
        function updateScrollIndicators() {
            const productsScroll = document.querySelector('.mobile-products-scroll');
            const indicators = document.querySelectorAll('.mobile-scroll-indicator');
            
            if (!productsScroll || !indicators.length) return;

            const scrollLeft = productsScroll.scrollLeft;
            const productWidth = 140;
            const maxVisible = 3;
            const pageWidth = productWidth * maxVisible;
            const currentPage = Math.round(scrollLeft / pageWidth);
            
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentPage);
            });
        }

        // 更新导航按钮状态
        function updateNavigationButtons() {
            const productsScroll = document.querySelector('.mobile-products-scroll');
            const prevBtn = document.querySelector('.mobile-nav-prev');
            const nextBtn = document.querySelector('.mobile-nav-next');
            
            if (!productsScroll || !prevBtn || !nextBtn) return;

            const scrollLeft = productsScroll.scrollLeft;
            const maxScroll = productsScroll.scrollWidth - productsScroll.clientWidth;
            
            prevBtn.style.opacity = scrollLeft <= 0 ? '0.5' : '1';
            nextBtn.style.opacity = scrollLeft >= maxScroll ? '0.5' : '1';
        }

        // 检查并初始化移动端表格
        function checkAndInitMobileTable() {
            const mobileContainer = document.querySelector('.mobile-table-container');
            const paramsColumn = document.querySelector('.mobile-params-column');
            const productsContainer = document.querySelector('.mobile-products-container');
            
            
            if (mobileContainer && paramsColumn && productsContainer && window.allProducts && window.allProducts.length > 0) {
                const paramsRows = paramsColumn.querySelectorAll('.mobile-table-row');
                const productColumns = productsContainer.querySelectorAll('.mobile-product-column');
                
                if (paramsRows.length === 0 || productColumns.length === 0) {
                    generateMobileTable();
                }
            }
        }

        // 更新产品选择状态
        function updateProductSelection() {
            // 获取所有选中的产品（包括桌面端和移动端）
            const desktopCheckboxes = document.querySelectorAll('input[type="checkbox"].product-checkbox:checked');
            const mobileCheckboxes = document.querySelectorAll('input[type="checkbox"].mobile-product-checkbox:checked');
            
            // 合并选中的产品ID
            const selectedIds = new Set();
            desktopCheckboxes.forEach(cb => selectedIds.add(cb.id));
            mobileCheckboxes.forEach(cb => selectedIds.add(cb.dataset.productId));
            
            // 更新全局产品状态
            if (window.productState) {
                window.productState.setSelectedProducts(Array.from(selectedIds));
            }
            
            // 更新AppState
            if (window.AppState) {
                window.AppState.selectedProducts = Array.from(selectedIds);
            }
            
        }

        // 重置按钮点击事件处理函数
        function handleResetButtonClick() {
            currentSelectedIds = [];
            
            // 获取所有产品复选框（桌面端和移动端）
            const desktopCheckboxes = document.querySelectorAll('.product-checkbox');
            const mobileCheckboxes = document.querySelectorAll('.mobile-product-checkbox');
            
            // 重置桌面端复选框状态
            desktopCheckboxes.forEach(checkbox => {
                checkbox.checked = false;
                const productElement = checkbox.closest('.product-selector');
                if (productElement) {
                    productElement.classList.remove('selected');
                }
            });
            
            // 重置移动端复选框状态
            mobileCheckboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            
            // 显示所有桌面端产品列
            const desktopTable = document.querySelector('.desktop-table');
            if (desktopTable) {
                const headerCells = desktopTable.querySelectorAll('thead th');
                headerCells.forEach((th, index) => {
                    if (index === 0) return; // 跳过参数名称列
                    th.style.display = '';
                });
                
                const dataRows = desktopTable.querySelectorAll('tbody tr');
                dataRows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    cells.forEach((cell, index) => {
                        if (index === 0) return; // 跳过参数名称列
                        cell.style.display = '';
                    });
                });
            }
            
            // 显示所有移动端产品列
            const mobileProductColumns = document.querySelectorAll('.mobile-product-column');
            mobileProductColumns.forEach(column => {
                column.style.display = '';
            });
            
            // 重置产品选择状态
            AppState.selectedProducts = [];
            
        }

        // 查看对比按钮点击事件处理
        function handleCompareButtonClick() {
            
            // 获取所有选中的产品（包括桌面端和移动端）
            const desktopCheckboxes = document.querySelectorAll('input[type="checkbox"].product-checkbox:checked');
            const mobileCheckboxes = document.querySelectorAll('input[type="checkbox"].mobile-product-checkbox:checked');
            
            // 合并选中的产品ID
            const selectedIds = new Set();
            desktopCheckboxes.forEach(cb => selectedIds.add(cb.id));
            mobileCheckboxes.forEach(cb => selectedIds.add(cb.dataset.productId));
            
            const selectedProducts = Array.from(selectedIds);
            currentSelectedIds = selectedProducts;
            
            if (selectedProducts.length === 0) {
                alert('请至少选择一个产品进行对比');
                return;
            }
            
            if (selectedProducts.length === 1) {
                alert('请选择至少两个产品进行对比');
                return;
            }
            
            // 隐藏未选中的产品列
            hideUnselectedProducts(selectedProducts);
            
            // 滚动到表格顶部
            const tableWrapper = document.querySelector('.table-wrapper');
            if (tableWrapper) {
                tableWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 隐藏未选中的产品列
        function hideUnselectedProducts(selectedProducts) {
            // 桌面端表格处理
            const desktopTable = document.querySelector('.desktop-table');
            if (desktopTable) {
                // 处理表头
                const headerCells = desktopTable.querySelectorAll('thead th');
                headerCells.forEach((th, index) => {
                    if (index === 0) return; // 跳过参数名称列
                    
                    const checkbox = th.querySelector('.product-checkbox');
                    if (checkbox && !selectedProducts.includes(checkbox.id)) {
                        th.style.display = 'none';
                    } else {
                        th.style.display = '';
                    }
                });
                
                // 处理数据行
                const dataRows = desktopTable.querySelectorAll('tbody tr');
                dataRows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    cells.forEach((cell, index) => {
                        if (index === 0) return; // 跳过参数名称列
                        
                        const productId = cell.getAttribute('data-product');
                        if (productId && !selectedProducts.includes(productId)) {
                            cell.style.display = 'none';
                        } else {
                            cell.style.display = '';
                        }
                    });
                });
            }
            
            // 移动端表格处理
            const mobileProductColumns = document.querySelectorAll('.mobile-product-column');
            mobileProductColumns.forEach(column => {
                const productId = column.dataset.productId;
                if (productId && !selectedProducts.includes(productId)) {
                    column.style.display = 'none';
                } else {
                    column.style.display = '';
                }
            });
            if (typeof syncMobileRowHeights === 'function') {
                syncMobileRowHeights();
            }
        }

        // 页面加载完成后执行初始化
        window.addEventListener('load', function() {
            // 初始化按钮事件处理器
            initializeButtonEvents();
        });

        // 初始化按钮事件处理器
        function initializeButtonEvents() {
            // 查看对比按钮事件处理
            const compareButton = document.getElementById('compare-button');
            if (compareButton) {
                compareButton.addEventListener('click', handleCompareButtonClick);
            }

            // 重置按钮事件处理
            const resetButton = document.getElementById('reset-button');
            if (resetButton) {
                resetButton.addEventListener('click', handleResetButtonClick);
            }
        }
        

        // 绑定图表相关事件
        function bindChartEvents() {
            // 关闭模态框
            const closeModal = document.querySelector('.close-modal');
            const modal = document.getElementById('performance-chart-modal');
            
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            // 点击模态框外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // 图表类型切换
            const chartTabs = document.querySelectorAll('.chart-tab');
            chartTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    chartTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const chartType = this.getAttribute('data-chart');
                    updatePerformanceChart(chartType);
                });
            });
        }

        // 显示性能图表
        function showPerformanceChart() {
            const modal = document.getElementById('performance-chart-modal');
            modal.style.display = 'block';
            
            // 获取当前激活的图表类型
            const activeTab = document.querySelector('.chart-tab.active');
            const chartType = activeTab ? activeTab.getAttribute('data-chart') : 'cpu';
            
            updatePerformanceChart(chartType);
        }

        // 初始化图表切换按钮
        function initChartTabs() {
            const chartTabs = document.querySelectorAll('.performance-charts-section .chart-tabs .chart-tab');
            chartTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    // 移除所有活动状态
                    chartTabs.forEach(t => t.classList.remove('active'));
                    // 添加当前活动状态
                    this.classList.add('active');
                    // 更新图表类型并重绘
                    currentChartType = this.dataset.chart;
                    updatePerformanceChart(currentChartType);
                });
            });
        }
        
        // 更新性能图表 - 使用所有产品数据而非仅选中的产品
        function updatePerformanceChart(chartType) {
            // 更新图表处理
            
            // 确保allProducts已加载
            if (!allProducts || allProducts.length === 0) {
                console.error('没有产品数据可用于图表！');
                return;
            }
            
            // 使用所有产品数据，而不是选中的产品
            let productData = [...allProducts];
            
            // 显示所有产品，不做数量限制
            
            let title;
            // 根据当前语言设置标题
            
            // 根据图表类型准备数据
            if (chartType === 'cpuSingle') {
                title = currentLanguage === 'zh-CN' ? 'CPU单核性能对比 (Geekbench)' : 'CPU Single-Core Performance (Geekbench)';
                // 提取单核性能数据
                productData = productData.map(p => {
                    let score = 0;
                    if (p.benchmarks && p.benchmarks.singleCore) {
                        score = parseInt(p.benchmarks.singleCore, 10);
                    } else if (p.cpuPerformance && typeof p.cpuPerformance === 'object' && p.cpuPerformance.singleCore) {
                        score = p.cpuPerformance.singleCore;
                    } else if (typeof p.cpuSingleCore === 'number') {
                        score = p.cpuSingleCore;
                    }
                    return { name: p.name, score: score };
                });
            } else if (chartType === 'cpuMulti') {
                title = currentLanguage === 'zh-CN' ? 'CPU多核性能对比 (Geekbench)' : 'CPU Multi-Core Performance (Geekbench)';
                // 提取多核性能数据
                productData = productData.map(p => {
                    let score = 0;
                    if (p.benchmarks && p.benchmarks.multiCore) {
                        score = parseInt(p.benchmarks.multiCore, 10);
                    } else if (p.cpuPerformance && typeof p.cpuPerformance === 'object' && p.cpuPerformance.multiCore) {
                        score = p.cpuPerformance.multiCore;
                    } else if (typeof p.cpuMultiCore === 'number') {
                        score = p.cpuMultiCore;
                    }
                    return { name: p.name, score: score };
                });
            } else { // gpu
                title = currentLanguage === 'zh-CN' ? 'GPU性能对比 (Geekbench Metal)' : 'GPU Performance (Geekbench Metal)';
                // 提取GPU性能数据
                productData = productData.map(p => {
                    let score = 0;
                    if (p.benchmarks && p.benchmarks.gpu) {
                        score = parseInt(p.benchmarks.gpu, 10);
                    } else {
                        score = p.gpuPerformance || 0;
                    }
                    return { name: p.name, score: score };
                });
            }
            
            // 按性能从高到低排序
            productData.sort((a, b) => b.score - a.score);
            
            // 过滤掉得分为0的产品
            productData = productData.filter(p => p.score > 0);
            
            if (productData.length === 0) {
                console.warn('过滤后没有有效的性能数据！');
            } else {
                // 性能数据处理完成
            }
            
            // 准备图表数据
            // 翻译产品名称
            const labels = productData.map(p => getLocalizedText(p.name, currentLanguage));
            const scores = productData.map(p => p.score);
            
            // 图表标签处理完成
            // 图表数据处理完成
            
            // 设置图表颜色
            const backgroundColors = [
                'rgba(0, 113, 227, 0.7)', // Apple蓝
                'rgba(255, 59, 48, 0.7)', // Apple红
                'rgba(52, 199, 89, 0.7)',  // Apple绿
                'rgba(255, 149, 0, 0.7)',  // Apple橙
                'rgba(175, 82, 222, 0.7)', // Apple紫
                'rgba(90, 200, 250, 0.7)'  // Apple天蓝
            ];
            
            // 如果图表已存在，销毁它
            if (performanceChart) {
                performanceChart.destroy();
            }
            
            // 创建新图表（横向柱状图）
            const canvas = document.getElementById('performance-chart');
            if (!canvas) {
                console.error('找不到图表canvas元素！');
                return;
            }
            
            const ctx = canvas.getContext('2d');
            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: scores,
                        backgroundColor: backgroundColors.slice(0, labels.length),
                        borderColor: backgroundColors.map(color => color.replace('0.7', '1')),
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y', // 设置为横向柱状图
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: title,
                            font: {
                                size: 16,
                                family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif'
                            },
                            padding: {
                                bottom: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ${context.raw}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: currentLanguage === 'zh-CN' ? '性能得分' : 'Performance Score',
                                font: {
                                    size: 14,
                                    family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif'
                                },
                                padding: {
                                    top: 10
                                }
                            },
                            grid: {
                                drawBorder: false
                            }
                        },
                        y: {
                            title: {
                                display: false
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                // 确保所有标签都显示
                                autoSkip: false,
                                // 增加标签的最大宽度
                                maxRotation: 0,
                                minRotation: 0,
                                padding: 10,
                                // 确保标签文字完整显示
                                callback: function(value) {
                                    const label = this.getLabelForValue(value);
                                    return label;
                                },
                                font: {
                                    size: 12
                                }
                            }
                        }
                    },
                    layout: {
                        padding: {
                            top: 20,
                            right: 20,
                            bottom: 20,
                            left: 20
                        }
                    },
                    // 动态调整图表高度以适应所有产品项
                    onResize: function(chart, size) {
                        // 根据显示的产品数量动态调整图表高度，每个产品分配更合理的高度
                        const heightPerItem = 20; // 每个产品项的高度增加到20像素
                        const padding = 120; // 为标题和边距预留空间
                        const newHeight = (productData.length * heightPerItem) + padding;
                        chart.canvas.parentNode.style.height = `${newHeight}px`;
                    },
                    animation: {
                        duration: 500
                    }
                }
            });
        }
        
        // 更新性能图表（页面底部的固定图表，独立于产品选择状态）
        function updatePerformanceCharts() {
            // 更新当前选中的图表类型
            updatePerformanceChart(currentChartType);
            // 性能图表更新完成
        }
        
        // 在页面加载完成后初始化图表切换按钮
        document.addEventListener('DOMContentLoaded', function() {
            initChartTabs();
            
            // 初始化图表
            setTimeout(() => {
                // 确保在所有DOM元素完全加载后初始化图表
                if (allProducts && allProducts.length > 0) {
                    updatePerformanceCharts();
                    // 页面加载后初始化图表完成
                }
            }, 500);
            
            // 模态框图表选项卡点击事件
            document.querySelectorAll('.modal-chart .chart-tabs .chart-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    // 移除所有选项卡的活动状态
                    document.querySelectorAll('.modal-chart .chart-tabs .chart-tab').forEach(t => {
                        t.classList.remove('active');
                    });
                    // 添加当前选项卡的活动状态
                    this.classList.add('active');
                    // 更新图表
                    updatePerformanceChart(this.dataset.chart);
                });
            });
        });
        
        // 兼容性函数 - GPU性能图表
        function updateGPUPerformanceChart() {
            // 直接调用新的统一图表函数
            updatePerformanceChart('gpu');
        }
        
        // 兼容性函数 - 单核性能图表
        function updateCPUSinglePerformanceChart() {
            updatePerformanceChart('cpuSingle');
        }
        
        // 兼容性函数 - 多核性能图表
        function updateCPUMultiPerformanceChart() {
            updatePerformanceChart('cpuMulti');
        }

        // 显示错误消息
        function displayErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            
            const container = document.querySelector('.main-content .container');
            container.prepend(errorDiv);
            
            // 5秒后自动消失
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
    </script>
